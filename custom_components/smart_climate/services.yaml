set_override_timer:
  name: Set Override Timer
  description: Set manual override for a fixed duration
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    minutes:
      name: Minutes
      description: Duration in minutes (1-120)
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    temperature:
      name: Temperature
      description: Target temperature during override
      required: true
      default: 21
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

set_override_infinity:
  name: Set Override Infinity
  description: Set manual override with no time limit
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature
      required: true
      default: 21
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

set_override_next_node:
  name: Set Override Next Node
  description: Set manual override until the next schedule node is reached
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature during override
      required: true
      default: 21
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

clear_override:
  name: Clear Override
  description: Return to auto mode
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate

set_interruptible:
  name: Set Interruptible
  description: Enable/disable interrupting override on presence change
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    interruptible:
      name: Interruptible
      description: Allow presence changes to interrupt override
      required: true
      default: true
      selector:
        boolean:

set_auto_temperature:
  name: Set Auto Temperature
  description: Set the target temperature used when presence is home in auto mode
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature when home (auto mode)
      required: true
      default: 21
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

set_away_temperature:
  name: Set Away Temperature
  description: Set the target temperature used when nobody is home
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature when away
      required: true
      default: 14
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

set_cool_auto_temperature:
  name: Set Cool Auto Temperature
  description: Set the target temperature used when home and the wrapped device is cooling
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature when home (cooling)
      required: true
      default: 24
      selector:
        number:
          min: 15
          max: 35
          step: 0.5
          unit_of_measurement: °C

set_cool_away_temperature:
  name: Set Cool Away Temperature
  description: Set the target temperature used when away and the wrapped device is cooling
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature when away (cooling)
      required: true
      default: 28
      selector:
        number:
          min: 15
          max: 35
          step: 0.5
          unit_of_measurement: °C

set_away_delay:
  name: Set Away Delay
  description: Set the delay in minutes before applying away temperature after everyone leaves
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    minutes:
      name: Minutes
      description: Delay in minutes before switching to away mode
      required: true
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min

set_default_override_mode:
  name: Set Default Override Mode
  description: Set the default mode used when a temperature override is triggered
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    mode:
      name: Mode
      description: Override mode (timer, infinity, or next_node)
      required: true
      default: timer
      selector:
        select:
          options:
            - timer
            - infinity
            - next_node
    duration:
      name: Duration
      description: Default timer duration in minutes (only applies when mode is timer)
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 480
          unit_of_measurement: min

set_schedule:
  name: Set Schedule
  description: Set the temperature schedule used in auto mode when presence is home
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    schedule:
      name: Schedule
      description: >
        Schedule configuration. Supports modes: "daily", "5/2", "individual".
        Example (daily):
          mode: daily
          daily:
            - time: "06:00"
              temp: 21
            - time: "22:00"
              temp: 18
        Example (5/2):
          mode: "5/2"
          weekday:
            - time: "07:00"
              temp: 21
            - time: "23:00"
              temp: 18
          weekend:
            - time: "08:00"
              temp: 21
            - time: "23:00"
              temp: 18
        Example (individual):
          mode: individual
          monday:
            - time: "06:00"
              temp: 21
          tuesday:
            - time: "06:00"
              temp: 21
      required: true
      selector:
        object:

set_cooling_mode:
  name: Set cooling mode
  description: >-
    Policy for automatic cooling. "off" never cools automatically, "on" always
    allows it, "auto" allows it only in a warm period (a forecast or measured
    outdoor high at or above the warm threshold) or when the room is above the
    hard ceiling. Heating overshoot in winter never turns into cooling.
  fields:
    entity_id:
      name: Entity
      description: The Smart Climate entity.
      required: true
      selector:
        entity:
          domain: climate
          integration: smart_climate
    mode:
      name: Mode
      description: off, auto or on.
      required: true
      selector:
        select:
          options:
            - "off"
            - auto
            - "on"

set_heat_support:
  name: Set heat support
  description: >-
    Enable or disable the support heater (e.g. the CV next to a more efficient
    primary heater such as an airco). When disabled only the primary heater
    heats.
  fields:
    entity_id:
      name: Entity
      description: The Smart Climate entity.
      required: true
      selector:
        entity:
          domain: climate
          integration: smart_climate
    enabled:
      name: Enabled
      description: Whether the support heater may join.
      required: true
      selector:
        boolean:

set_observe:
  name: Set observe
  description: >-
    Observe ("proefdraaien"): the coordinator keeps deciding and logs what it
    would send to each device, but drives nothing. Use it to compare its
    choices with how you run the devices yourself before handing over.
  fields:
    entity_id:
      name: Entity
      description: The Smart Climate entity.
      required: true
      selector:
        entity:
          domain: climate
          integration: smart_climate
    enabled:
      name: Enabled
      description: Observe only (true) or drive the devices (false).
      required: true
      selector:
        boolean:

set_behaviour:
  name: Set behaviour
  description: >-
    Fan boost: while heating, run the primary heater's fan on high when the room
    is more than 1 degree below the target, medium within that, auto near it.
    Hold: keep the primary heater heating at the target while the room is warm
    enough (it modulates on its own sensor) instead of switching it off, with
    its setpoint 1 degree lower when the room stays too warm.
  fields:
    entity_id:
      name: Entity
      description: The Smart Climate entity.
      required: true
      selector:
        entity:
          domain: climate
          integration: smart_climate
    fan_boost:
      name: Fan boost
      required: false
      selector:
        boolean:
    hold_primary:
      name: Hold primary heater
      required: false
      selector:
        boolean:

set_device_mode:
  name: Set device mode
  description: >-
    Choose how the coordinator treats one actuator device. "auto" lets the
    coordinator drive it, "off" keeps it off and never uses it, "manual" is hands
    off (you operate it yourself). Optionally only for a while: after the given
    minutes (or at the given time) the device returns to auto.
  fields:
    entity_id:
      name: Entity
      description: The Smart Climate entity.
      required: true
      selector:
        entity:
          domain: climate
          integration: smart_climate
    device:
      name: Device
      description: The actuator climate entity (as listed in the devices attribute).
      required: true
      selector:
        entity:
          domain: climate
    mode:
      name: Mode
      description: auto, off or manual.
      required: true
      selector:
        select:
          options:
            - auto
            - "off"
            - manual
    minutes:
      name: Minutes
      description: Return to auto after this many minutes (optional).
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
    until:
      name: Until
      description: Return to auto at this date and time (optional, ignored when minutes is set).
      required: false
      selector:
        datetime:

set_support_pause:
  name: Set support pause
  description: >-
    Pause (or resume) every support heater, e.g. "no CV tomorrow morning" or
    "I'm leaving soon". With until_morning the pause lasts until the next 10:00
    (configurable in the options); with minutes it lasts that long; without
    either it stays until you resume it.
  fields:
    entity_id:
      name: Entity
      description: The Smart Climate entity.
      required: true
      selector:
        entity:
          domain: climate
          integration: smart_climate
    enabled:
      name: Pause
      description: true to pause, false to resume.
      required: false
      default: true
      selector:
        boolean:
    minutes:
      name: Minutes
      description: Pause for this many minutes (optional).
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
    until_morning:
      name: Until morning
      description: Pause until the next skip-until time (default 10:00).
      required: false
      default: false
      selector:
        boolean:

set_support_boost:
  name: Set support boost
  description: >-
    "CV erbij": let the support heater (e.g. the CV) join right now, for a while
    (default an hour) or until the room reaches its target, whichever comes first.
    Lifts a support pause; a support heater set to off or manual keeps that choice.
  fields:
    entity_id:
      name: Entity
      description: The Smart Climate entity.
      required: true
      selector:
        entity:
          domain: climate
          integration: smart_climate
    enabled:
      name: Boost
      description: true to start, false to stop.
      required: false
      default: true
      selector:
        boolean:
    minutes:
      name: Minutes
      description: How long at most (default 60).
      required: false
      selector:
        number:
          min: 10
          max: 480
          step: 10
          unit_of_measurement: min
