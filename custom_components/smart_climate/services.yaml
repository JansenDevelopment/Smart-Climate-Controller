set_override_timer:
  name: Set Override Timer
  description: Set manual override for a fixed duration
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    minutes:
      name: Minutes
      description: Duration in minutes (1-120)
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    temperature:
      name: Temperature
      description: Target temperature during override
      required: true
      default: 21
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

set_override_infinity:
  name: Set Override Infinity
  description: Set manual override with no time limit
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature
      required: true
      default: 21
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

set_override_next_node:
  name: Set Override Next Node
  description: Set manual override until the next schedule node is reached
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature during override
      required: true
      default: 21
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

clear_override:
  name: Clear Override
  description: Return to auto mode
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate

set_interruptible:
  name: Set Interruptible
  description: Enable/disable interrupting override on presence change
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    interruptible:
      name: Interruptible
      description: Allow presence changes to interrupt override
      required: true
      default: true
      selector:
        boolean:

set_auto_temperature:
  name: Set Auto Temperature
  description: Set the target temperature used when presence is home in auto mode
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature when home (auto mode)
      required: true
      default: 21
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

set_away_temperature:
  name: Set Away Temperature
  description: Set the target temperature used when nobody is home
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature when away
      required: true
      default: 14
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

set_cool_auto_temperature:
  name: Set Cool Auto Temperature
  description: Set the target temperature used when home and the wrapped device is cooling
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature when home (cooling)
      required: true
      default: 24
      selector:
        number:
          min: 15
          max: 35
          step: 0.5
          unit_of_measurement: °C

set_cool_away_temperature:
  name: Set Cool Away Temperature
  description: Set the target temperature used when away and the wrapped device is cooling
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature when away (cooling)
      required: true
      default: 28
      selector:
        number:
          min: 15
          max: 35
          step: 0.5
          unit_of_measurement: °C

set_away_delay:
  name: Set Away Delay
  description: Set the delay in minutes before applying away temperature after everyone leaves
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    minutes:
      name: Minutes
      description: Delay in minutes before switching to away mode
      required: true
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min

set_default_override_mode:
  name: Set Default Override Mode
  description: Set the default mode used when a temperature override is triggered
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    mode:
      name: Mode
      description: Override mode (timer, infinity, or next_node)
      required: true
      default: timer
      selector:
        select:
          options:
            - timer
            - infinity
            - next_node
    duration:
      name: Duration
      description: Default timer duration in minutes (only applies when mode is timer)
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 480
          unit_of_measurement: min

set_schedule:
  name: Set Schedule
  description: Set the temperature schedule used in auto mode when presence is home
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    schedule:
      name: Schedule
      description: >
        Schedule configuration. Supports modes: "daily", "5/2", "individual".
        Example (daily):
          mode: daily
          daily:
            - time: "06:00"
              temp: 21
            - time: "22:00"
              temp: 18
        Example (5/2):
          mode: "5/2"
          weekday:
            - time: "07:00"
              temp: 21
            - time: "23:00"
              temp: 18
          weekend:
            - time: "08:00"
              temp: 21
            - time: "23:00"
              temp: 18
        Example (individual):
          mode: individual
          monday:
            - time: "06:00"
              temp: 21
          tuesday:
            - time: "06:00"
              temp: 21
      required: true
      selector:
        object:

set_device_role:
  name: Set Device Role
  description: Change one actuator device's role (heat, cool, or both)
  fields:
    entity_id:
      name: Entity
      description: Smart Climate coordinator entity
      required: true
      selector:
        entity:
          domain: climate
    device:
      name: Device
      description: The actuator climate entity to re-role
      required: true
      selector:
        entity:
          domain: climate
    role:
      name: Role
      description: What the device may do
      required: true
      selector:
        select:
          options:
            - heat
            - cool
            - both
