set_override_timer:
  name: Set Override Timer
  description: Set manual override for a fixed duration
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    minutes:
      name: Minutes
      description: Duration in minutes (1-120)
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    temperature:
      name: Temperature
      description: Target temperature during override
      required: true
      default: 21
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

set_override_infinity:
  name: Set Override Infinity
  description: Set manual override with no time limit
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature
      required: true
      default: 21
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: °C

clear_override:
  name: Clear Override
  description: Return to auto mode
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate

set_interruptible:
  name: Set Interruptible
  description: Enable/disable interrupting override on presence change
  fields:
    entity_id:
      name: Entity
      description: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    interruptible:
      name: Interruptible
      description: Allow presence changes to interrupt override
      required: true
      default: true
      selector:
        boolean:
